<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="Inter, Arial, sans-serif">
  <title>Esquema de ligação do Smart Room (planejado, ainda não testado em hardware)</title>
  <rect width="960" height="610" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0b2a40">Smart Room — esquema de ligação</text>
  <text x="480" y="58" text-anchor="middle" font-size="14" fill="#4a6178">Planejado conforme o Documento de Especificação 2.0 · ainda não testado em hardware</text>

  <!-- ESP32 -->
  <rect x="380" y="95" width="200" height="370" rx="16" fill="#eef6fc" stroke="#0b4f7a" stroke-width="3"/>
  <text x="480" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#0b2a40">ESP32 DevKit</text>
  <text x="480" y="152" text-anchor="middle" font-size="13" fill="#4a6178">Wi-Fi 2,4 GHz · 3,3 V</text>
  <text x="392" y="174" font-size="14" font-weight="600" fill="#0b2a40">GPIO4</text>
  <text x="392" y="334" font-size="14" font-weight="600" fill="#0b2a40">GPIO34</text>
  <text x="568" y="174" text-anchor="end" font-size="14" font-weight="600" fill="#0b2a40">GPIO21 (SDA)</text>
  <text x="568" y="214" text-anchor="end" font-size="14" font-weight="600" fill="#0b2a40">GPIO22 (SCL)</text>
  <text x="568" y="384" text-anchor="end" font-size="14" font-weight="600" fill="#0b2a40">GPIO35</text>
  <text x="480" y="440" text-anchor="middle" font-size="13" fill="#4a6178">3V3 · 5V (VIN) · GND</text>

  <!-- DHT22 -->
  <rect x="50" y="135" width="180" height="80" rx="12" fill="#ffffff" stroke="#0b4f7a" stroke-width="2.5"/>
  <text x="140" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#0b2a40">DHT22</text>
  <text x="140" y="187" text-anchor="middle" font-size="13" fill="#4a6178">temp. e umidade</text>
  <text x="140" y="205" text-anchor="middle" font-size="12" fill="#4a6178">VCC 3V3 · GND</text>
  <line x1="230" y1="170" x2="380" y2="170" stroke="#0b4f7a" stroke-width="3"/>
  <text x="305" y="161" text-anchor="middle" font-size="13" font-weight="600" fill="#0b4f7a">DATA</text>
  <text x="305" y="192" text-anchor="middle" font-size="11" fill="#4a6178">pull-up 10 kΩ</text>
  <text x="305" y="206" text-anchor="middle" font-size="11" fill="#4a6178">(sensor solto)</text>

  <!-- MQ-135 + divisor -->
  <rect x="50" y="285" width="180" height="90" rx="12" fill="#ffffff" stroke="#a61b1b" stroke-width="2.5"/>
  <text x="140" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#0b2a40">MQ-135</text>
  <text x="140" y="337" text-anchor="middle" font-size="13" fill="#4a6178">qualidade do ar</text>
  <text x="140" y="357" text-anchor="middle" font-size="12" fill="#4a6178">VCC 5V (VIN) · GND</text>
  <line x1="230" y1="330" x2="262" y2="330" stroke="#a61b1b" stroke-width="3"/>
  <rect x="262" y="302" width="86" height="56" rx="8" fill="#fde4e4" stroke="#a61b1b" stroke-width="2"/>
  <text x="305" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#a61b1b">Divisor</text>
  <text x="305" y="344" text-anchor="middle" font-size="12" fill="#a61b1b">10k + 20k</text>
  <line x1="348" y1="330" x2="380" y2="330" stroke="#a61b1b" stroke-width="3"/>
  <text x="140" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#a61b1b">AO chega a 5 V:</text>
  <text x="140" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#a61b1b">reduzir para 3,3 V</text>

  <!-- I2C -->
  <rect x="740" y="110" width="180" height="80" rx="12" fill="#ffffff" stroke="#0b4f7a" stroke-width="2.5"/>
  <text x="830" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#0b2a40">BH1750</text>
  <text x="830" y="162" text-anchor="middle" font-size="13" fill="#4a6178">luminosidade (lux)</text>
  <text x="830" y="180" text-anchor="middle" font-size="12" fill="#4a6178">3V3 · GND · ADDR→GND</text>
  <rect x="740" y="220" width="180" height="80" rx="12" fill="#ffffff" stroke="#0b4f7a" stroke-width="2.5"/>
  <text x="830" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#0b2a40">Display OLED</text>
  <text x="830" y="272" text-anchor="middle" font-size="13" fill="#4a6178">SSD1306 128×64 (0x3C)</text>
  <text x="830" y="290" text-anchor="middle" font-size="12" fill="#4a6178">VCC 3V3 · GND</text>

  <!-- barramento SDA (verde) -->
  <polyline points="580,170 700,170" fill="none" stroke="#1b6b43" stroke-width="3"/>
  <polyline points="700,145 700,255" fill="none" stroke="#1b6b43" stroke-width="3"/>
  <line x1="700" y1="145" x2="740" y2="145" stroke="#1b6b43" stroke-width="3"/>
  <line x1="700" y1="255" x2="740" y2="255" stroke="#1b6b43" stroke-width="3"/>
  <!-- barramento SCL (laranja) -->
  <polyline points="580,210 660,210" fill="none" stroke="#b45309" stroke-width="3"/>
  <polyline points="660,128 660,282" fill="none" stroke="#b45309" stroke-width="3"/>
  <line x1="660" y1="128" x2="740" y2="128" stroke="#b45309" stroke-width="3"/>
  <line x1="660" y1="282" x2="740" y2="282" stroke="#b45309" stroke-width="3"/>
  <circle cx="660" cy="170" r="5" fill="#ffffff" stroke="#4a6178" stroke-width="2"/>
  <text x="600" y="120" font-size="13" font-weight="700" fill="#4a6178">barramento I²C</text>
  <text x="682" y="274" font-size="12" fill="#1b6b43" font-weight="600">SDA</text>
  <text x="640" y="302" font-size="12" fill="#b45309" font-weight="600">SCL</text>

  <!-- KY-038 -->
  <rect x="740" y="345" width="180" height="80" rx="12" fill="#ffffff" stroke="#a61b1b" stroke-width="2.5"/>
  <text x="830" y="375" text-anchor="middle" font-size="17" font-weight="700" fill="#0b2a40">KY-038</text>
  <text x="830" y="397" text-anchor="middle" font-size="13" fill="#4a6178">nível de som</text>
  <text x="830" y="415" text-anchor="middle" font-size="12" fill="#4a6178">3V3 · GND · usar AO</text>
  <line x1="580" y1="380" x2="740" y2="380" stroke="#a61b1b" stroke-width="3"/>
  <text x="660" y="371" text-anchor="middle" font-size="13" font-weight="600" fill="#a61b1b">AO</text>

  <!-- notas -->
  <rect x="50" y="490" width="870" height="96" rx="12" fill="#eef6fc" stroke="#b9cfe0" stroke-width="2"/>
  <text x="70" y="518" font-size="14" font-weight="700" fill="#0b2a40">Alimentação e regras importantes</text>
  <text x="70" y="541" font-size="13" fill="#35506a">• 3V3 → DHT22, BH1750, OLED e KY-038 · 5V (pino VIN) → só o MQ-135 · todos os GND ligados juntos.</text>
  <text x="70" y="561" font-size="13" fill="#35506a">• O MQ-135 pode dar até 5 V na saída AO; o ESP32 aceita no máximo 3,3 V. Sem o divisor, o pino GPIO34 pode ser danificado.</text>
  <text x="70" y="581" font-size="13" fill="#35506a">• GPIO34 e GPIO35 são entradas do ADC1, que funciona junto com o Wi-Fi (o ADC2 não).</text>
</svg>
